spring.application.name=ebank-bot
spring.cloud.discovery.enabled=true
spring.cloud.config.enabled=false
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
spring.config.import=optional:file:.env[.properties]

spring.ai.model.chat=google-genai
spring.ai.google.genai.api-key=${API_KEY}
spring.ai.google.genai.chat.model=gemini-3.5-flash-lite
server.port=8083

spring.ai.mcp.client.streamable-http.connections.customer.url=${CUSTOMER_SERVICE_URL:http://localhost:8082}
spring.ai.mcp.client.streamable-http.connections.customer.endpoint=/mcp