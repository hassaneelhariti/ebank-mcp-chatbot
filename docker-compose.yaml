services:
  ebank-db:
    image: postgres:16
    environment:
      POSTGRES_DB: ebank_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ebank-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d ebank_db" ]
      interval: 5s
      timeout: 3s
      retries: 10

  ebank-service:
    build: ./ebank-service
    ports:
      - "8081:8081"
    environment:
      DB_URL: jdbc:postgresql://localhost:5432/ebank_db
      DB_USER: postgres
      DB_PASSWORD: postgres
    depends_on:
      ebank-db:
        condition: service_healthy

volumes:
  ebank-db-data:




