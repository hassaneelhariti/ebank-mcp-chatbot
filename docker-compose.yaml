services:
  discovery-service:
    build: ./discovery-service
    ports:
      - "8761:8761"

  ebank-db:
    image: postgres:16
    environment:
      POSTGRES_DB: ebank_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ebank-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d ebank_db" ]
      interval: 5s
      timeout: 3s
      retries: 10

  customer-db:
    image: postgres:16
    environment:
      POSTGRES_DB: customer-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - customer-db-data:/var/lib.postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d customer-db" ]
      interval: 5s
      timeout: 3s
      retries: 10


  ebank-service:
    build: ./ebank-service
    ports:
      - "8081:8081"
    environment:
      DB_URL: jdbc:postgresql://ebank-db:5432/ebank_db
      DB_USER: postgres
      DB_PASSWORD: postgres
    depends_on:
      ebank-db:
        condition: service_healthy
      discovery-service:
        condition: service_healthy

  customer-service:
    build: ./customer-service
    ports:
      - "8082:8082"
    environment:
      DB_URL: jdbc:postgresql://customer-db:5432/customer
      DB_USER: postgres
      DB_PASSWORD: postgres
    depends_on:
      customer-db:
        condition: service_healthy
      discovery-service:
        condition: service_healthy

volumes:
  ebank-db-data:
  customer-db-data:




