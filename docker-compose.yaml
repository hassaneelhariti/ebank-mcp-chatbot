services:
  discovery-service:
    build: ./discovery-service
    ports:
      - "8761:8761"
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://localhost:8761/ || exit 1" ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  ebank-db:
    image: postgres:16
    environment:
      POSTGRES_DB: ebank_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ebank-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d ebank_db" ]
      interval: 5s
      timeout: 3s
      retries: 10

  customer-db:
    image: postgres:16
    environment:
      POSTGRES_DB: customer-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - customer-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d customer-db" ]
      interval: 5s
      timeout: 3s
      retries: 10

  gateway-service:
    build: ./gateway-service
    ports:
      - "9999:9999"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
    depends_on:
      discovery-service:
        condition: service_healthy

  ebank-service:
    build: ./ebank-service
    ports:
      - "8081:8081"
    environment:
      DB_URL: jdbc:postgresql://ebank-db:5432/ebank_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
    depends_on:
      ebank-db:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      customer-service:
        condition: service_healthy
  ebank-bot:
    build: ./ebank-bot
    environment:
      API_KEY: ${API_KEY}
      CUSTOMER_SERVICE_URL: http://customer-service:8082
      EBANK_SERVICE_URL: http://ebank-service:8081
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
    depends_on:
      discovery-service:
        condition: service_healthy
      customer-service:
        condition: service_healthy
  customer-service:
    build: ./customer-service
    ports:
      - "8082:8082"
    environment:
      DB_URL: jdbc:postgresql://customer-db:5432/customer-db
      DB_USER: postgres
      DB_PASSWORD: postgres
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8082/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    depends_on:
      customer-db:
        condition: service_healthy
      discovery-service:
        condition: service_healthy

volumes:
  ebank-db-data:
  customer-db-data:




