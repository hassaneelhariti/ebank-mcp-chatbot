
spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: customer-route
              uri: lb://CUSTOMER-SERVICE
              predicates:
                - Path=/customers/**

            - id: ebank-route
              uri: lb://EBANK-SERVICE
              predicates:
                - Path=/accounts/**

            - id: ebank-bot
              uri: lb://EBANK-BOT
              predicates:
                - Path=/chat,/chat/**
